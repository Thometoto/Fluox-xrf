[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluox-mo"
version = "0.1.0"
description = "Multi-label element identification from calibrated XRF spectra with a Mo anode."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "flask>=3.0",
  "joblib>=1.3",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fluox-mo = "fluox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
